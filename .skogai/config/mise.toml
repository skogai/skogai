min_version = "2026.10.4"   # older mise rejects `secrets` on a task

[settings]
experimental = true         # mise secrets is experimental

[tools]
"packslip:github.com/skogai/cli" = "latest"
fnox = "latest"

# fnox is the secrets source. A task gets a secret only by listing it in
# `secrets = [...]`; the shell, `mise env` and other tasks never see it.
# Secret definitions live in fnox.toml at the repo root.
[secrets.fnox]

[deps]
git-submodule = { auto = true }

# Agent-facing tasks. Tags are our own convention; mise gives them no meaning.
# Find them with: mise tasks ls --tag agent --json
[tasks."agent:status"]
description = "Show repo and submodule state"
tags = ["agent", "check"]
dir = "{{cwd}}"
run = ["git status --short --branch", "git submodule status"]
